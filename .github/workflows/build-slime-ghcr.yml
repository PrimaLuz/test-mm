name: Build Slime Image ghcr

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile-slime'
      - '.github/workflows/build-slime-ghcr.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}      
          password: ${{ secrets.GITHUB_TOKEN }}  

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile-slime
          push: true
          tags: |
            ghcr.io/primaluz/slime:2025.3.9
            ghcr.io/primaluz/slime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max