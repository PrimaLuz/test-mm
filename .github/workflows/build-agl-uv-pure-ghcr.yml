name: Build AgentLightning Image UV-pure ghcr

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile-agl-uv-pure-g'
      - '.github/workflows/build-agl-uv-pure-ghcr.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # ⭐ 必须：允许推送镜像

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}      # ✅ 自动提供，无需配置
          password: ${{ secrets.GITHUB_TOKEN }}  # ✅ 自动提供，无需配置

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile-agl-pure-g
          push: true
          tags: |
            ghcr.io/primaluz/agentlightning:0.3.0.post4
            ghcr.io/primaluz/agentlightning:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max