name: Build AgentLightning Image UV-PIP-GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile-agl-uv-pip-g'
      - '.github/workflows/build-agl-uv-pip-g.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 第一步：暴力清理磁盘
      - name: Free disk space (Extensive)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}     
          password: ${{ secrets.GITHUB_TOKEN }}  

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile-agl-uv-pip-g
          push: true
          tags: |
            ghcr.io/primaluz/agentlightning:0.3.0.h1
            ghcr.io/primaluz/agentlightning:latest
          cache-from: type=inline
          cache-to: type=inline,mode=max
