name: Build Slime Image ghcr

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile-slime'
      - '.github/workflows/build-slime-ali.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIA }}
          username: ${{ secrets.ALIB }}
          password: ${{ secrets.ALIC }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile-slime
          push: true
          tags: |
            ${{ secrets.ALID }}/slime:2025.3.11
            ${{ secrets.ALID }}/slime:latest
          # cache-from: type=gha
          # cache-to: type=gha,mode=max